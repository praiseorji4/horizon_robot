controller_manager:
  ros__parameters:
    update_rate: 50 # In Hz



    # Joint_state_broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController




wheel_velocity_controller:
  ros__parameters:
    joints:
      - base_front_left_wheel_joint
      - base_front_right_wheel_joint
      - base_rear_left_wheel_joint
      - base_rear_right_wheel_joint
    

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_front_left_wheel_joint", "base_rear_left_wheel_joint"]
    right_wheel_names: ["base_front_right_wheel_joint", "base_rear_right_wheel_joint"]


    wheel_separation: 0.31
    wheel_radius: 0.0425


    odom_frame_id: odom
    base_frame_id: base_footprint


    enable_odom_tf: true

    open_loop: false
    position_feedback: true

    cmd_vel_timeout: 0.5

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

mecanum_drive_controller:
  ros__parameters:
    reference_timeout: 0.5
    front_left_wheel_command_joint_name: "base_front_left_wheel_joint"
    front_right_wheel_command_joint_name: "base_front_right_wheel_joint"
    rear_right_wheel_command_joint_name: "base_rear_right_wheel_joint"
    rear_left_wheel_command_joint_name: "base_rear_left_wheel_joint"

    kinematics:
      base_frame_offset: {x: 0.0, y: 0.0, theta: 0.0}
      wheels_radius: 0.0425
      sum_of_robot_center_projection_on_X_Y_axis: 0.315

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    enable_odom_tf: true

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

    linear:
      x: 
        max_velocity: 0.2 
        max_acceleration: 1.0
        max_deceleration: -1.0

      y:
        max_acceleration: 1.0
        max_deceleration: -1.0
        max_acceleration_reverse: -1.0
        max_deceleration_reverse: 1.0

    angular:
      z:
        max_acceleration: 1.0
        max_deceleration: -1.0
        max_acceleration_reverse: -1.0
        max_deceleration_reverse: 1.0